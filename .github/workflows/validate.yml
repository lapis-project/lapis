name: Validate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-validate
  cancel-in-progress: true

jobs:
  quality:
    name: Repository lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint:check

  apps:
    name: Check ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [lexat, corpus, lexvad]
    env:
      NUXT_PUBLIC_APP_BASE_URL: http://localhost:3000
      NUXT_PUBLIC_API_BASE_URL: http://localhost:5000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter ./apps/${{ matrix.app }} types:check

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm --filter ./apps/${{ matrix.app }} build

  lexat-e2e:
    name: LexAT Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: testing
    env:
      # Frontend vars
      NUXT_PUBLIC_APP_BASE_URL: ${{ vars.NUXT_PUBLIC_APP_BASE_URL }}
      NUXT_PUBLIC_API_BASE_URL: ${{ vars.NUXT_PUBLIC_API_BASE_URL }}
      NUXT_PUBLIC_REDMINE_ID: ${{ vars.NUXT_PUBLIC_REDMINE_ID }}
      NUXT_PUBLIC_ZOTERO_BASE_URL: ${{ vars.NUXT_PUBLIC_ZOTERO_BASE_URL }}

      # Backend vars
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      BACKEND_PORT: ${{ vars.BACKEND_PORT }}
      PGDATABASE: ${{ vars.PGDATABASE }}
      PGHOST: ${{ vars.PGHOST }}
      PGPORT: ${{ vars.PGPORT }}
      PGUSER: ${{ vars.PGUSER }}

      # Backend secrets
      IMGPROXY_KEY: ${{ secrets.IMGPROXY_KEY }}
      IMGPROXY_SALT: ${{ secrets.IMGPROXY_SALT }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter ./apps/lexat exec playwright install --with-deps chromium

      - name: Build LexAT
        run: pnpm --filter ./apps/lexat build

      - name: Start database
        run: docker compose --env-file .env.localsetup up -d --wait --wait-timeout 180

      - name: Seed database
        run:
          docker compose --env-file .env.localsetup exec -T database sh -c 'psql -U "$POSTGRES_USER"
          -d "$POSTGRES_DB"' < ./db/lapis_dump.sql

      - name: Run E2E tests
        run: pnpm --filter ./apps/lexat test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-lexat
          path: apps/lexat/playwright-report/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose --env-file .env.localsetup down

  validate:
    name: Validate
    if: always()
    needs: [quality, apps, lexat-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
