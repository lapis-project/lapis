name: Deploy to Dev Workflow

concurrency:
  group:
    "${{ github.workflow }}-${{ inputs.git_ref || github.ref }}-${{ inputs.app_name }}-build-deploy"
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      git_ref:
        required: false
        type: string
        default: ""
      # --- Public Build Arguments as Inputs ---
      # ADD NEW BUILD_ARGS HERE (Also look further down in the file!!!)
      NUXT_PUBLIC_ZOTERO_BASE_URL:
        required: false
        type: string
      NUXT_PUBLIC_REDMINE_ID:
        required: false
        type: string
      NUXT_PUBLIC_MAP_BASELAYER_URL_LIGHT:
        required: false
        type: string
      NUXT_PUBLIC_MAP_BASELAYER_URL_DARK:
        required: false
        type: string
      NUXT_PUBLIC_APP_BASE_URL:
        required: false
        type: string

jobs:
  validate:
    name: Validate (${{ inputs.app_name }})
    uses: ./.github/workflows/validate.yml
    with:
      backend_only: ${{ inputs.app_name == 'backend' }}
    secrets: inherit

  setup_workflow_env:
    environment: dev-${{ inputs.app_name }}
    runs-on: ubuntu-latest
    outputs:
      environment: "${{ steps.set_outputs.outputs.environment }}"
      environment_short: "${{ steps.set_outputs.outputs.environment_short }}"
      image_name: ""
      registry_root: "ghcr.io/${{ github.repository }}"
      default_port: "3000"
      fetch-depth: 10
      submodules: "true"
      PUBLIC_URL: "${{ vars.PUBLIC_URL || vars.PUBLIC_URL_BACKEND || vars.PUBLIC_URL_FRONTEND }}"
      APP_NAME: ${{ inputs.app_name }}
      APP_ROOT: /
    steps:
      - name: Set Workflow outputs
        id: set_outputs
        run: |
          echo "environment=dev-${{ inputs.app_name }}" >> "$GITHUB_OUTPUT"
          echo "environment_short=dev-${{ inputs.app_name }}" >> "$GITHUB_OUTPUT"

  generate_workflow_vars:
    needs:
      - setup_workflow_env
    environment:
      name: "${{ needs.setup_workflow_env.outputs.environment }}"
    runs-on: ubuntu-latest
    steps:
      - name: Generate PUBLIC_URL if not set
        id: generate_public_url
        run: >
          kube_ingress_base_domain="${{ vars.KUBE_INGRESS_BASE_DOMAIN }}"

          public_url="${{ needs.setup_workflow_env.outputs.PUBLIC_URL || vars.PUBLIC_URL }}"

          if [ "${public_url}x" == 'x' ]

          then public_url=https://${{ needs.setup_workflow_env.outputs.environment_short
          }}.${kube_ingress_base_domain}

          fi

          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"
      - name: Generate APP_ROOT
        id: generate_app_root
        run: |
          app_root="${{ vars.APP_ROOT || vars.APP_ROOT_FRONTEND || needs.setup_workflow_env.outputs.APP_ROOT }}"
          echo "app_root=${app_root:-/}" >> "$GITHUB_OUTPUT"
      - name: Export SERVICE_ID
        id: generate_service_id
        run: |
          echo "service_id=${{ vars.SERVICE_ID || vars.SERVICE_ID_BACKEND || vars.SERVICE_ID_FRONTEND }}" >> "$GITHUB_OUTPUT"
    outputs:
      PUBLIC_URL: "${{ steps.generate_public_url.outputs.public_url }}"
      APP_ROOT: "${{ steps.generate_app_root.outputs.app_root }}"
      SERVICE_ID: "${{ steps.generate_service_id.outputs.service_id }}"

  build_and_deploy:
    name: Build and push docker image
    needs:
      - validate
      - setup_workflow_env
      - generate_workflow_vars
    environment:
      name: "${{ needs.setup_workflow_env.outputs.environment }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Set App-Specific Configuration
        id: config
        shell: bash
        env:
          # Prefer explicit workflow inputs, falling back to environment/repository vars
          # ADD NEW BUILD_ARGS HERE
          NUXT_PUBLIC_ZOTERO_BASE_URL:
            ${{ inputs.NUXT_PUBLIC_ZOTERO_BASE_URL || vars.NUXT_PUBLIC_ZOTERO_BASE_URL }}
          NUXT_PUBLIC_REDMINE_ID:
            ${{ inputs.NUXT_PUBLIC_REDMINE_ID || vars.NUXT_PUBLIC_REDMINE_ID || vars.SERVICE_ID }}
          NUXT_PUBLIC_MAP_BASELAYER_URL_LIGHT:
            ${{ inputs.NUXT_PUBLIC_MAP_BASELAYER_URL_LIGHT ||
            vars.NUXT_PUBLIC_MAP_BASELAYER_URL_LIGHT }}
          NUXT_PUBLIC_MAP_BASELAYER_URL_DARK:
            ${{ inputs.NUXT_PUBLIC_MAP_BASELAYER_URL_DARK || vars.NUXT_PUBLIC_MAP_BASELAYER_URL_DARK
            }}
          NUXT_PUBLIC_APP_BASE_URL:
            ${{ inputs.NUXT_PUBLIC_APP_BASE_URL || needs.generate_workflow_vars.outputs.PUBLIC_URL
            }}
          STUDIO_GITHUB_CLIENT_ID: ${{ vars.K8S_SECRET_STUDIO_GITHUB_CLIENT_ID }}
        run: |
          APP_NAME="${{ inputs.app_name }}"
          case "$APP_NAME" in
            backend)
              echo "dockerfile=Dockerfile_Backend" >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT"
              ;;
            lexat)
              echo "dockerfile=Dockerfile_Lexat" >> "$GITHUB_OUTPUT"
              BUILD_ARGS=$(printf "%s\n" \
                "NUXT_PUBLIC_ZOTERO_BASE_URL=${NUXT_PUBLIC_ZOTERO_BASE_URL}" \
                "NUXT_PUBLIC_REDMINE_ID=${NUXT_PUBLIC_REDMINE_ID}" \
                "NUXT_PUBLIC_MAP_BASELAYER_URL_LIGHT=${NUXT_PUBLIC_MAP_BASELAYER_URL_LIGHT}" \
                "NUXT_PUBLIC_MAP_BASELAYER_URL_DARK=${NUXT_PUBLIC_MAP_BASELAYER_URL_DARK}" \
                "NUXT_PUBLIC_APP_BASE_URL=${NUXT_PUBLIC_APP_BASE_URL}")
              {
                echo "build_args<<EOF"
                echo "$BUILD_ARGS"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            corpus)
              echo "dockerfile=Dockerfile_Corpus" >> "$GITHUB_OUTPUT"
              BUILD_ARGS=$(printf "%s\n" \
                "NUXT_PUBLIC_ZOTERO_BASE_URL=${NUXT_PUBLIC_ZOTERO_BASE_URL}" \
                "NUXT_PUBLIC_REDMINE_ID=${NUXT_PUBLIC_REDMINE_ID}" \
                "NUXT_PUBLIC_MAP_BASELAYER_URL_LIGHT=${NUXT_PUBLIC_MAP_BASELAYER_URL_LIGHT}" \
                "NUXT_PUBLIC_MAP_BASELAYER_URL_DARK=${NUXT_PUBLIC_MAP_BASELAYER_URL_DARK}" \
                "NUXT_PUBLIC_APP_BASE_URL=${NUXT_PUBLIC_APP_BASE_URL}")
              {
                echo "build_args<<EOF"
                echo "$BUILD_ARGS"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            lexvad)
              echo "dockerfile=Dockerfile_Lexvad" >> "$GITHUB_OUTPUT"
              BUILD_ARGS=$(printf "%s\n" \
                "NUXT_PUBLIC_REDMINE_ID=${NUXT_PUBLIC_REDMINE_ID}" \
                "NUXT_PUBLIC_APP_BASE_URL=${NUXT_PUBLIC_APP_BASE_URL}")
              {
                echo "build_args<<EOF"
                echo "$BUILD_ARGS"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            lioe)
              echo "dockerfile=Dockerfile_Lioe" >> "$GITHUB_OUTPUT"
              BUILD_ARGS=$(printf "%s\n" \
                "NUXT_PUBLIC_REDMINE_ID=${NUXT_PUBLIC_REDMINE_ID}" \
                "NUXT_PUBLIC_APP_BASE_URL=${NUXT_PUBLIC_APP_BASE_URL}" \
                "STUDIO_GITHUB_CLIENT_ID=${STUDIO_GITHUB_CLIENT_ID}")
              {
                echo "build_args<<EOF"
                echo "$BUILD_ARGS"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported app_name: $APP_NAME" >&2
              exit 1
              ;;
          esac
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: "Extract metadata (tags, labels) for Docker"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: >
            ghcr.io/${{ github.repository }}-${{ inputs.app_name }}-dev
          flavor: |
            latest=auto
          tags: |
            type=raw,value={{sha}}
            type=ref,event=branch
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ steps.config.outputs.dockerfile }}
          build-args: ${{ steps.config.outputs.build_args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          cache-from: type=gha
          cache-to: "type=gha,mode=max"

  deploy:
    permissions:
      contents: read
      packages: write
    name: Deploy docker image
    needs:
      - setup_workflow_env
      - generate_workflow_vars
      - build_and_deploy
    uses: lapis-project/gl-autodevops-minimal-port/.github/workflows/deploy.yml@main
    secrets: inherit
    with:
      environment: "${{ needs.setup_workflow_env.outputs.environment }}"
      do_not_generate_additional_host_names: "true"
      DOCKER_TAG: ${{ needs.setup_workflow_env.outputs.registry_root }}-${{ inputs.app_name }}-dev
      APP_NAME: lapis-${{ needs.setup_workflow_env.outputs.APP_NAME }}-dev
      APP_ROOT: "${{ needs.generate_workflow_vars.outputs.APP_ROOT }}"
      SERVICE_ID: "${{ needs.generate_workflow_vars.outputs.SERVICE_ID }}"
      PUBLIC_URL: "${{ needs.generate_workflow_vars.outputs.PUBLIC_URL }}"
      default_port: "${{ needs.setup_workflow_env.outputs.default_port }}"

  clean_up_cache:
    permissions:
      actions: write
      contents: read
    needs:
      - build_and_deploy
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Purge Cache for current branch
        run: |
          TARGET_REF="${{ inputs.git_ref || github.ref }}"
          echo "Finding caches for branch: $TARGET_REF"
          # Fetch cache ids for current branch and delete them
          gh cache list --ref "$TARGET_REF" --json id --jq '.[].id' | xargs -I {} gh cache delete {} || echo "No caches found or failed to delete."

          echo "Cache purge complete."
