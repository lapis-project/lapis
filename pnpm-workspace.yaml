packages:
  - "apps/*"

catalog:
  "@lucide/vue": ^1.70.0
  lefthook: ^2.2.2
  "npm-run-all2": ^9.0.4
  nuxt: ^4.6.4
  oxfmt: ^0.77.0
  oxlint: ^1.92.0
  vue: ^3.5.45
  tailwindcss: ^4.3.5
  typescript: ^6.0.2
  vite: ^8.3.6
  "vue-i18n": 11.4.18
  "vue-router": ^5.4.0

overrides:
  "vue-i18n": 11.4.9
  # lexvad pins deck.gl 9.3.10; deck.gl 9.4 / luma.gl 9.4 break ScatterplotLayer and GPU
  # HexagonLayer on ANGLE D3D11 (Intel). deck.gl's `^9.3.3` luma range would pull in 9.4,
  # so luma.gl is forced here. Remove together with the deck.gl pin once fixed upstream.
  "@luma.gl/core": 9.3.6
  "@luma.gl/engine": 9.3.6
  "@luma.gl/shadertools": 9.3.6
  "@luma.gl/webgl": 9.3.6

# -------------------------
# Hoisting Rules
# -------------------------
publicHoistPattern:
  - "*@tailwindcss/vite*"
  - "@nuxtjs/mdc*"
  - "remark*"
  - "rehype*"
  - "unified*"
  - "unist*"
  - "parse5*"
  - "debug*"

# -------------------------
# Engine & Environment Settings
# -------------------------
engineStrict: true
pmOnFail: warn
shellEmulator: true

# -------------------------
# Security Policies
# -------------------------
# Enforce a 3-day (4320 minutes) cooldown period for all new packages
# 1 day = 1440, 3 days = 4320, 7 days = 10080
minimumReleaseAge: 1440
blockExoticSubdeps: true

# -------------------------
# Build Script Approvals
# -------------------------
allowBuilds:
  "@intlify/vue-i18n-bridge": true
  "@intlify/vue-router-bridge": true
  "@parcel/watcher": true
  "better-sqlite3": true
  "esbuild": true
  lefthook: true
  "maplibre-gl": true
  "sharp": true
  "unrs-resolver": true
  "vue-demi": true
